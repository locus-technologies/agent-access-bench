[project]
name = "agent-access-bench"
version = "0.1.0"
description = "Pre-registered benchmark: do AI agents finish more real tasks with paid data access?"
authors = [
    { name = "cdermott7", email = "dermottcole@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "boto3>=1.43.106",
    "e2b-code-interpreter>=2.10.1",
    "google-genai>=2.28.0",
    "inspect-ai>=0.3.276",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "openai-agents>=0.23.1",
    "pandas>=3.0.6",
    "xai-sdk>=1.20.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
